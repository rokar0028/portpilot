name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app migrations tests
      - run: ruff format --check app migrations tests
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portpilot_e2e
          POSTGRES_USER: portpilot_e2e
          POSTGRES_PASSWORD: portpilot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portpilot_e2e -d portpilot_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PORTPILOT_E2E: "1"
      PORTPILOT_POSTGRES_TESTS: "1"
      DATABASE_URL: postgresql+psycopg://portpilot_e2e:portpilot_e2e@127.0.0.1:5432/portpilot_e2e
      FRONTEND_ORIGIN: http://127.0.0.1:13000
      ADMIN_API_TOKEN: portpilot-local-e2e-token
      NEXT_PUBLIC_API_URL: http://127.0.0.1:18000
      PORTPILOT_E2E_API_URL: http://127.0.0.1:18000
      PORTPILOT_E2E_WEB_URL: http://127.0.0.1:13000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend dependencies
        working-directory: api
        run: python -m pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Apply migrations
        working-directory: api
        run: python -m alembic upgrade head
      - name: Seed curated catalogue twice
        working-directory: api
        run: |
          python -m app.seed
          python -m app.seed
      - name: Add synthetic browser fixtures
        working-directory: api
        run: python -m e2e_fixtures
      - name: Verify PostgreSQL API behavior
        working-directory: api
        run: python -m pytest tests/test_postgres_api.py -q
      - name: Build standalone frontend
        working-directory: web
        run: npm run build:e2e
      - name: Start preview API service
        working-directory: api
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 18000 > /tmp/portpilot-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$PORTPILOT_E2E_API_URL/ready" > /dev/null; then
              echo "API preview service ready on port 18000."
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "API preview service failed to start on port 18000."
              cat /tmp/portpilot-api.log || true
              exit 1
            fi
            sleep 1
          done
      - name: Start preview frontend service
        working-directory: web
        run: |
          PORTPILOT_E2E_DIST_DIR=.next-e2e HOSTNAME=127.0.0.1 PORT=13000 NEXT_PUBLIC_API_URL="$PORTPILOT_E2E_API_URL" nohup node node_modules/next/dist/bin/next start > /tmp/portpilot-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$PORTPILOT_E2E_WEB_URL" > /dev/null; then
              echo "Frontend preview service ready on port 13000."
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Frontend preview service failed to start on port 13000."
              cat /tmp/portpilot-web.log || true
              exit 1
            fi
            sleep 1
          done
      - name: Verify preview deployment technical gates
        run: |
          python api/scripts/verify_preview_deployment.py \
            --api-url "$PORTPILOT_E2E_API_URL" \
            --web-url "$PORTPILOT_E2E_WEB_URL" \
            --output-json preview-verification-report.json \
            --output-md preview-verification-report.md \
            --verbose
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            cat preview-verification-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload preview verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portpilot-preview-verification-ci
          path: |
            preview-verification-report.json
            preview-verification-report.md
          retention-days: 5
          if-no-files-found: ignore
      - name: Run Chromium P0 journeys
        working-directory: web
        run: npm run e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portpilot-e2e-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
            /tmp/portpilot-api.log
            /tmp/portpilot-web.log
          retention-days: 5
          if-no-files-found: ignore
