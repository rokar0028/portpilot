services:
  e2e-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portpilot_e2e
      POSTGRES_USER: portpilot_e2e
      POSTGRES_PASSWORD: portpilot_e2e
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portpilot_e2e -d portpilot_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20
